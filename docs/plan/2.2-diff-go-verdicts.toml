# tools/aimux-codegen/tests/wire_diff_go.rs). One `[Type]` section per type,
# `"field" = "generator bug" | "handwritten bug"`. A diff row without an
# entry, an entry without a row, or a verdict that contradicts the Rust serde
# output fails the test.

[ImageResult]
