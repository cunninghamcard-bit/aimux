# Verdicts for docs/plan/2.2-diff-go.md (human-filled; read by
# tools/aimux-codegen/tests/wire_diff_go.rs). One `[Type]` section per type,
# `"field" = "generator bug" | "handwritten bug"`. A diff row without an
# entry, an entry without a row, or a verdict that contradicts the Rust serde
# output fails the test.

[ImageResult]
# Rust Vec<Vec<u8>> (ImageOutputs::Binary, image_model.rs) serializes as an
# array of numbers; hand-written `Bytes` (multimodal_types.go) always
# re-encodes as a base64 string.
"images[0]" = "handwritten bug"
# ImageResult.warnings has no skip_serializing_if: serde writes `[]`; the
# hand-written field is `omitempty` and drops it.
"warnings" = "handwritten bug"

[AudioData]
# AudioData::Binary(Vec<u8>) (speech_model.rs) serializes as a number array;
# hand-written `AudioData = Bytes` re-encodes it as base64.
"(value)" = "handwritten bug"

[ImageOutputs]
# ImageOutputs::Binary(Vec<Vec<u8>>): number arrays in Rust, base64 strings
# from the hand-written `[]Bytes`.
"[0]" = "handwritten bug"

[SearchResult]
# SearchResultItem.providerMetadata exists in Rust (search_model.rs); the
# hand-written SearchResultItem has no such field and drops it.
"results[0].providerMetadata.x.x.k" = "handwritten bug"

[SearchResultItem]
# Same missing providerMetadata field as above.
"providerMetadata.x.x.k" = "handwritten bug"

[StreamPart]
# The hand-written StreamPart is {Type, Raw} with `json:"-"` on both, so
# json.Marshal writes `{}` for every part.
"(all fields)" = "handwritten bug"

[TranscriptionCallOptions]
# audio: AudioInput::Binary(Vec<u8>) is a number array in Rust; the
# hand-written `Bytes` re-encodes it as base64.
"audio" = "handwritten bug"

[VideoData]
# VideoData::Binary { data: Vec<u8> } is a number array in Rust; the
# hand-written `Bytes` re-encodes it as base64.
"data" = "handwritten bug"
