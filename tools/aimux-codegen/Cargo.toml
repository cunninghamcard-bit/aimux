[package]
name = "aimux-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generator PoC (phase 1 unit 1.8): one type spec -> TypeScript + Go"
publish = false

[[bin]]
name = "aimux-codegen"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Unit 2.1: Rust-source extraction (syn) and the manifest input hash.
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
aimux-core = { workspace = true }
